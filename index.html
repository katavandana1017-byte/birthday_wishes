<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>

  <title>Happy Birthday 🎂</title>
</head>

<body>

  <!-- Music Button -->
  <button class="music-btn" onclick="toggleMusic()">🎵</button>

  <!-- Popup -->
  <div class="popup" id="popup">
    🎉 Surprise! Have an amazing birthday!
  </div>

  <!-- Balloons -->
  <div class="balloons">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
  </div>

  <!-- Birthday Card -->
  <div class="birthday-card">
    <div class="cake" onclick="cakeClick()">🎂</div>

    <h1 id="title">Happy Birthday!</h1>

    <p id="message">
      Wishing you a day filled with happiness,
      laughter, and lots of love.
    </p>

    <button class="btn" onclick="celebrate()">
      Celebrate 🎉
    </button>

    <button class="btn" onclick="changeWish()">
      New Wish 💌
    </button>
  </div>


  <!-- Birthday Song -->
  <audio id="birthdaySong" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

</body>
</html>
